<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت شهرنگار</title><style>body{font-family:Tahoma;background:#f6f8fb;margin:0;color:#263238}.top{background:#263238;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:25px 5%}.panel{background:#fff;border-radius:18px;padding:20px;margin-bottom:20px;box-shadow:0 3px 15px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,textarea,select,button{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:9px}button{cursor:pointer;font-weight:bold}.primary{background:#06d6a0;color:#fff;border:0}.danger{background:#ef476f;color:#fff;border:0}.order{border:1px solid #eee;padding:12px;border-radius:12px;margin:10px 0}.muted{color:#666;font-size:13px}</style><div class="top"><b>⚙️ مدیریت شهرنگار</b><div><button onclick="location.href='/'">فروشگاه</button> <button onclick="logout()">خروج</button></div></div><main class="wrap"><section class="panel"><h2>➕ افزودن محصول</h2><div class="grid"><input id="name" placeholder="نام محصول"><input id="category" placeholder="دسته‌بندی"><input id="price" type="number" placeholder="قیمت تومان"><input id="stock" type="number" placeholder="موجودی"><input id="emoji" placeholder="ایموجی مثل 📒"><textarea id="description" placeholder="توضیحات"></textarea></div><button class="primary" onclick="addProduct()">افزودن</button></section><section class="panel"><h2>📦 محصولات</h2><div id="products"></div></section><section class="panel"><h2>🧾 سفارش‌ها</h2><div id="orders"></div></section></main><script>const fa=n=>Number(n).toLocaleString('fa-IR');async function api(url,opt={}){const r=await fetch(url,opt);if(r.status===401){location.href='/login.html';throw 0}const d=await r.json();if(!r.ok)throw new Error(d.error||'خطا');return d}async function init(){const me=await fetch('/api/me').then(r=>r.json());if(!me.user){location.href='/login.html';return}loadProducts();loadOrders()}async function loadProducts(){const ps=await api('/api/admin/products');products.innerHTML=ps.map(p=>`<div class="order"><b>${p.emoji} ${p.name}</b><div class="muted">${p.category} | ${fa(p.price)} تومان | موجودی ${fa(p.stock)}</div><input id="n${p.id}" value="${esc(p.name)}"><input id="p${p.id}" type="number" value="${p.price}"><input id="s${p.id}" type="number" value="${p.stock}"><button class="primary" onclick="edit(${p.id})">ذخیره تغییرات</button><button class="danger" onclick="removeProduct(${p.id})">حذف از فروشگاه</button></div>`).join('')||'<p>محصولی نیست.</p>'}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}async function addProduct(){try{await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,category:category.value,price:Number(price.value),stock:Number(stock.value),emoji:emoji.value,description:description.value})});['name','category','price','stock','emoji','description'].forEach(id=>document.getElementById(id).value='');loadProducts()}catch(e){alert(e.message)}}async function edit(id){const p=(await api('/api/admin/products')).find(x=>x.id===id);p.name=document.getElementById('n'+id).value;p.price=Number(document.getElementById('p'+id).value);p.stock=Number(document.getElementById('s'+id).value);await api('/api/admin/products/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});loadProducts()}async function removeProduct(id){if(!confirm('این محصول از فروشگاه مخفی شود؟'))return;await api('/api/admin/products/'+id,{method:'DELETE'});loadProducts()}async function loadOrders(){const os=await api('/api/admin/orders');orders.innerHTML=os.map(o=>`<div class="order"><b>سفارش #${o.id}</b><div>${esc(o.customer_name)} — ${esc(o.phone)}</div><div>${esc(o.address)}</div><div>${o.items.map(i=>`${esc(i.product_name)} × ${i.quantity}`).join('، ')}</div><b>${fa(o.total)} تومان</b><select onchange="status(${o.id},this.value)"><option value="new" ${o.status==='new'?'selected':''}>جدید</option><option value="processing" ${o.status==='processing'?'selected':''}>در حال آماده‌سازی</option><option value="shipped" ${o.status==='shipped'?'selected':''}>ارسال شد</option><option value="done" ${o.status==='done'?'selected':''}>تکمیل شد</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>لغو شد</option></select></div>`).join('')||'<p>هنوز سفارشی ثبت نشده.</p>'}async function status(id,statusValue){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:statusValue})});loadOrders()}async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}init();</script></html>
