<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شهرنگار | لوازم‌تحریر</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fffaf3;color:#263238}header{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#ff6b6b,#ffd166,#06d6a0,#4dabf7);padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:900;color:#fff}.nav button,.add,.checkout{border:0;border-radius:12px;padding:10px 15px;font-weight:bold;cursor:pointer}.nav button{background:#fff}.hero{text-align:center;padding:55px 6%;background:linear-gradient(#fff0bf,#fffaf3)}h1{font-size:42px;margin:0 0 12px}.hero p{font-size:18px}.cta{background:#ef476f;color:#fff}.wrap{max-width:1100px;margin:auto;padding:35px 5%}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 25px}.filters button{border:0;background:#fff;border-radius:12px;padding:10px 15px;box-shadow:0 2px 10px #0001;cursor:pointer}.filters .on{background:#06d6a0;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 18px #0001}.pic{height:155px;border-radius:16px;background:#f1f6ff;display:grid;place-items:center;font-size:65px}.price{font-weight:900;color:#ef476f}.add{width:100%;margin-top:12px;background:#4dabf7;color:#fff}.add:disabled{opacity:.5;cursor:not-allowed}.cart{position:fixed;right:0;top:0;height:100%;width:min(410px,94%);background:#fff;z-index:30;box-shadow:-5px 0 25px #0003;padding:24px;transform:translateX(105%);transition:.25s;overflow:auto}.cart.open{transform:translateX(0)}.cartitem{padding:12px 0;border-bottom:1px solid #eee}.close{float:left;border:0;border-radius:8px;padding:7px;cursor:pointer}.checkout{width:100%;background:#06d6a0;color:#fff;margin-top:10px}footer{text-align:center;background:#263238;color:#fff;padding:28px;margin-top:40px}dialog{border:0;border-radius:18px;padding:25px;width:min(520px,90%);box-shadow:0 10px 50px #0004}dialog::backdrop{background:#0007}input,textarea{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:10px}label{font-weight:bold}
</style>
<body><header><div class="logo">🌈 شهرنگار</div><div class="nav"><button onclick="scrollTo({top:0,behavior:'smooth'})">خانه</button><button onclick="openCart()">🛒 سبد (<span id="count">۰</span>)</button><button onclick="location.href='/admin'">⚙️ مدیریت</button></div></header>
<section class="hero"><h1>شهرنگار</h1><p>دنیای رنگارنگ لوازم‌تحریر برای ایده‌های بزرگ ✨</p><button class="nav cta" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">مشاهده محصولات</button></section>
<main class="wrap"><h2>محصولات</h2><div class="filters" id="filters"></div><div id="products" class="grid"></div></main><footer>© شهرنگار — فروشگاه لوازم‌تحریر</footer>
<aside class="cart" id="cart"><button class="close" onclick="closeCart()">✕</button><h2>🛒 سبد خرید</h2><div id="cartItems"></div><h3>مجموع: <span id="total">۰</span> تومان</h3><button class="checkout" onclick="checkout()">ثبت سفارش</button></aside>
<dialog id="order"><h2>ثبت سفارش</h2><form onsubmit="submitOrder(event)"><label>نام و نام خانوادگی</label><input id="customer" required><label>شماره تماس</label><input id="phone" inputmode="tel" required><label>آدرس</label><textarea id="address" required></textarea><button class="checkout">ثبت سفارش</button></form></dialog>
<script>
let products=[],cart=JSON.parse(localStorage.getItem('shahrnegar_cart')||'[]');const fa=n=>Number(n).toLocaleString('fa-IR');
async function load(){const r=await fetch('/api/products');products=await r.json();render();updateCart()}function render(cat='همه'){const cats=['همه',...new Set(products.map(p=>p.category))];filters.innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" onclick="render('${c.replaceAll("'","\\'")}')">${c}</button>`).join('');const list=cat==='همه'?products:products.filter(p=>p.category===cat);document.getElementById('products').innerHTML=list.map(p=>`<article class="card"><div class="pic">${p.emoji}</div><h3>${p.name}</h3><p>${p.description||''}</p><div class="price">${fa(p.price)} تومان</div><small>موجودی: ${fa(p.stock)}</small><button class="add" ${p.stock<1?'disabled':''} onclick="add(${p.id})">${p.stock<1?'ناموجود':'افزودن به سبد 🛒'}</button></article>`).join('')}
function saveCart(){localStorage.setItem('shahrnegar_cart',JSON.stringify(cart))}function add(id){const p=products.find(x=>x.id===id);if(!p||p.stock<1)return;const x=cart.find(i=>i.productId===id);if(x)x.quantity++;else cart.push({productId:id,quantity:1});saveCart();updateCart()}function updateCart(){count.textContent=fa(cart.reduce((s,i)=>s+i.quantity,0));let total=0;cart=cart.filter(i=>products.some(p=>p.id===i.productId));cartItems.innerHTML=cart.map(i=>{const p=products.find(x=>x.id===i.productId);const sum=p.price*i.quantity;total+=sum;return `<div class="cartitem">${p.emoji} ${p.name}<br>${fa(i.quantity)} × ${fa(p.price)} تومان <button onclick="removeOne(${p.id})">حذف</button></div>`}).join('')||'<p>سبد خرید خالی است.</p>';document.getElementById('total').textContent=fa(total);saveCart()}function removeOne(id){const i=cart.find(x=>x.productId===id);if(!i)return;if(i.quantity>1)i.quantity--;else cart=cart.filter(x=>x.productId!==id);updateCart()}function openCart(){cartEl().classList.add('open');updateCart()}function closeCart(){cartEl().classList.remove('open')}function cartEl(){return document.getElementById('cart')}
function checkout(){if(!cart.length)return alert('سبد خرید خالی است.');document.getElementById('order').showModal()}
async function submitOrder(e){e.preventDefault();const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerName:customer.value,phone:phone.value,address:address.value,items:cart})});const data=await r.json();if(!r.ok)return alert(data.error||'خطا');cart=[];saveCart();order.close();closeCart();await load();alert(`سفارش شما با شماره ${data.orderId} ثبت شد. مبلغ: ${fa(data.total)} تومان`)}
load().catch(()=>alert('ارتباط با فروشگاه برقرار نشد.'));
</script></body></html>
