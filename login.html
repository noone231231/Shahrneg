<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | شهرنگار</title><style>body{font-family:Tahoma;background:#fffaf3;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:30px;border-radius:20px;box-shadow:0 5px 25px #0002;width:min(420px,90%)}input,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #ddd}button{background:#06d6a0;color:white;border:0;font-weight:bold;cursor:pointer}</style><div class="box"><h1>🔐 ورود مدیر</h1><input id="email" type="email" placeholder="ایمیل"><input id="password" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button><p id="msg"></p></div><script>async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok)location.href='/admin';else msg.textContent=d.error||'خطا'}</script></html>
